[package]
name = "cc-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
# load-dynamic: no prebuilt download at build time (pyke CDN is unreachable here);
# the runtime dll comes from ORT_DYLIB_PATH / the search path (spec 分发 ships it)
ort = { version = "2.0.0-rc.15", default-features = false, features = ["load-dynamic"] }
pdfium-render = { workspace = true }
image = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
keyring = { workspace = true }
# edge-tts (ticket 07): WebSocket client for the Edge read-aloud service; native-tls
# for the real wss:// endpoint, plain ws:// reaches the local mock in tests
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
tokio = { workspace = true, features = ["rt", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# ticket 11: script_import_notes reads pptx (a zip of slide parts)
zip = { workspace = true }
quick-xml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }
tokio = { workspace = true }
keyring = { workspace = true }

[lints]
workspace = true
