[package]
name = "cc-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "课影 CourseCast 桌面壳（Tauri 2 + Vue 3）：六步向导的薄包装，业务全部在 cc-core"

[dependencies]
cc-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
dirs = { workspace = true }
time = { workspace = true }
tauri = { version = "2", features = ["protocol-asset"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = { workspace = true }
image = { workspace = true }
sha2 = { workspace = true }
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }

[lib]
name = "cc_app"
path = "src/lib.rs"

[[bin]]
name = "cc-app"
path = "src/main.rs"

# main.rs is the Tauri shell; tests only exercise the command layer in lib.rs,
# which must build without spawning a window
[features]
default = []

[lints]
workspace = true
