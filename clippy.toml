# BeautifulRust clippy configuration, adopted alongside [workspace.lints].
# https://github.com/morganlinton/BeautifulRust

# A bool argument is unreadable at the call site (report(true)) and cannot grow
# a third mode; prefer a two-variant enum or two methods.
max-fn-params-bools = 0

# Tests use unwrap/expect/print as assertions and diagnostics.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true
