name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Setup MSYS2 MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm mingw-w64-x86_64-make

      - name: Cache ffmpeg build
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: |
            packaging/build/prefix
            packaging/dist/ffmpeg.exe
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('packaging/build-ffmpeg.sh') }}

      - name: Build minimal ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          export PATH="/c/msys64/mingw64/bin:$PATH"
          bash packaging/build-ffmpeg.sh

      - name: Download runtime assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/pdfium runtime
          curl -fL --retry 3 -o vendor/rvm_mobilenetv3_fp32.onnx \
            https://github.com/PeterL1n/RobustVideoMatting/releases/download/v1.0.0/rvm_mobilenetv3_fp32.onnx
          echo "88d4531297118f595bf2fd60f6f566aec2e559393802d1f436c380f0cbbd2828 *vendor/rvm_mobilenetv3_fp32.onnx" | sha256sum -c -
          curl -fL --retry 3 -o /tmp/pdfium-win-x64.tgz \
            https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/8111/pdfium-win-x64.tgz
          tar -xzf /tmp/pdfium-win-x64.tgz -C vendor/pdfium
          test -f vendor/pdfium/bin/pdfium.dll
          python -m pip install --disable-pip-version-check "onnxruntime==1.31.0"
          python - <<'PY'
          import pathlib, shutil, onnxruntime
          src = pathlib.Path(onnxruntime.__file__).parent / "capi" / "onnxruntime.dll"
          dst = pathlib.Path("runtime/onnxruntime.dll")
          shutil.copyfile(src, dst)
          print(f"{src} -> {dst}")
          PY
          ls -lh vendor/rvm_mobilenetv3_fp32.onnx vendor/pdfium/bin/pdfium.dll runtime/onnxruntime.dll packaging/dist/ffmpeg.exe

      - name: Build NSIS installer
        shell: bash
        env:
          MAIN_REPO: ${{ github.workspace }}
          ORT_DLL: ${{ github.workspace }}\runtime\onnxruntime.dll
        run: |
          set -euo pipefail
          export MAIN_REPO="$(cygpath -m "$MAIN_REPO")"
          export ORT_DLL="$(cygpath -m "$ORT_DLL")"
          bash packaging/build-installer.sh

      - name: Install git-cliff
        run: cargo install git-cliff --locked --version 2.14.2

      - name: Generate changelog
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          PREV_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            git-cliff --config cliff.toml --tag "$TAG" --range "${PREV_TAG}..${TAG}" --strip header --output release-notes.md
          else
            git-cliff --config cliff.toml --tag "$TAG" --strip header --output release-notes.md
          fi
          if [ ! -s release-notes.md ] || [ "$(wc -c < release-notes.md)" -lt 100 ]; then
            {
              echo "## $TAG"
              echo
              git log "$TAG" --no-merges --pretty=format:'- %s (%h)'
              echo
            } > release-notes.md
          fi
          test -s release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          SETUP="$(find target/release/bundle/nsis -maxdepth 1 -name '*-setup.exe' -print -quit)"
          test -n "$SETUP"
          sha256sum "$SETUP" > SHA256SUMS.txt
          if grep -q '__发行方补充__' packaging/SOURCE-OFFER.txt; then
            echo "::warning title=SOURCE-OFFER::发行方联系方式仍为占位符；发布含 GPL 组件的二进制前请确认源码要约。"
          fi
          ASSETS=("$SETUP" SHA256SUMS.txt LICENSE packaging/SOURCE-OFFER.txt release-notes.md)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "CourseCast $TAG" \
              --notes-file release-notes.md \
              --draft
          fi
          gh release edit "$TAG" --draft=false
